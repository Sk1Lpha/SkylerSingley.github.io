        <h2 class="questions">Questions or Special Order?</h2>
        <h3 class="contactMeHeading">Contact me here!</h3>
        <p class="required">Required fields are marked with an asterisk *</p>
        <form method="post" action="https://webdevbasics.net/scripts/demo.php" class="form">
            <label for="myFName">*First Name</label>
            <input type="text" name="myFName" id="myFName" required>
            <label for="myLName">*Last Name</label>
            <input type="text" name="myLName" id="myLName" required>
            <label for="myEmail">E-mail Address</label>
            <input type="text" name="myEmail" id="myEmail">
            <label for="myNumber">*Phone Number</label>
            <input type="text" name="myNumber" id="myNumber" maxlength="12" required>
            <label for="myComments">Questions or Special Order Request</label>
            <textarea name="myComments" id="myComments" rows="10" cols="60"></textarea>
            <input type="submit">
        </form>
